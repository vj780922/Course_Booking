<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ili・能量工作紡 🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --light-green: #f0fff4;
            --booked-green: #c6f6d5; /* 私教已預約的淺綠色 */
            --dark-gray: #2d3748;
            --base-font-size: 16px;
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: #f7fafc; 
            display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: var(--dark-gray); 
            -webkit-tap-highlight-color: transparent;
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; box-sizing: border-box; }
        
        .type-selector { display: flex; background: #edf2f7; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .type-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; color: #718096; }
        .type-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        h1 { text-align: center; color: var(--primary-green); margin: 10px 0; font-size: 22px; }

        .admin-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
        .admin-btn { background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
        .admin-mode-active { background: #f56565 !important; color: white; }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--light-green); padding: 10px; border-radius: 12px; }
        .nav-btn { background: var(--primary-green); color: white; border: none; border-radius: 8px; padding: 8px 15px; cursor: pointer; font-weight: bold; }

        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 600px; }
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 8px 4px; height: 60px; font-size: 13px; }
        
        .date-main { font-weight: bold; color: var(--dark-gray); font-size: 15px; }
        .date-sub { font-size: 11px; color: #a0aec0; display: block; }

        td { cursor: pointer; background: white; transition: background 0.2s; position: relative; }
        .time-col { background-color: #f8fafc; font-weight: bold; width: 65px; color: #718096; position: sticky; left: 0; z-index: 2; border-right: 2px solid #edf2f7; }
        
        /* 狀態樣式更新 */
        .booked-private { background-color: var(--booked-green) !important; color: #276749; font-weight: bold; }
        .booked-group { background-color: #ebf8ff !important; color: #2b6cb0; }
        .occupied { background-color: #f7fafc !important; color: #cbd5e0 !important; cursor: not-allowed; }
        .full { background-color: #fff5f5 !important; color: #c53030 !important; font-weight: bold; cursor: not-allowed; }
        .blocked { background-color: #cbd5e0 !important; color: white !important; cursor: not-allowed; }

        /* 彈窗樣式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { 
            background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; 
            max-width: 100%; animation: slideUp 0.3s ease-out; box-sizing: border-box; overflow-y: auto; max-height: 90vh;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-banner { width: 100%; height: 100px; background: var(--primary-green) url('https://images.unsplash.com/photo-1518611012118-296072bb5604?auto=format&fit=crop&q=80&w=600') center/cover; }
        .modal-body { padding: 20px 25px 40px 25px; }
        
        .info-grid { background: #f7fafc; padding: 12px; border-radius: 12px; margin: 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-item { font-size: 13px; }
        .info-label { color: #a0aec0; display: block; margin-bottom: 2px; }
        
        .capacity-box { background: #fffaf0; border: 1px dashed #ed8936; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; text-align: center; }

        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn { border: none; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; text-align: center; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }
        .btn-danger { color: #f56565; background: transparent; font-size: 13px; }

        .admin-section { border-top: 1px solid #edf2f7; margin-top: 15px; padding-top: 15px; }
        
        @media (min-width: 600px) {
            .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>鈺見酪梨・健身預約 🥑</h1>
    
    <div class="type-selector">
        <button id="btnGroup" class="type-btn active" onclick="switchType('group')">團體課程</button>
        <button id="btnPrivate" class="type-btn" onclick="switchType('private')">私人教練</button>
    </div>

    <div class="admin-bar">
        <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">管理員</button>
    </div>
    
    <div class="controls">
        <button class="nav-btn" onclick="changeWeek(-7)">◀</button>
        <span id="weekDisplay" style="font-size: 14px; font-weight: bold;">讀取中...</span>
        <button class="nav-btn" onclick="changeWeek(7)">▶</button>
    </div>

    <div class="table-wrapper">
        <table id="bookingTable">
            <thead><tr id="dateHeader"><th class="time-col">時段</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="modal-banner"></div>
        <div class="modal-body">
            <h2 id="mTitle" style="margin:5px 0;">課程預約</h2>
            <div style="font-size: 14px; color: var(--primary-green);">教練：鈺珊 ILi 🥑</div>

            <div class="info-grid">
                <div class="info-item"><span class="info-label">日期</span><span id="mDate" style="font-weight:bold;"></span></div>
                <div class="info-item"><span class="info-label">時段</span><span id="mTime" style="font-weight:bold;"></span></div>
            </div>

            <div id="groupInfo" class="capacity-box" style="display:none;">
                目前人數：<span id="curCount" style="color:red; font-weight:bold;">0</span> / <span id="maxCount">5</span>
            </div>

            <div id="userFields">
                <input type="text" id="custName" placeholder="請輸入學員姓名">
            </div>

            <div class="btn-group">
                <button id="saveBtn" class="btn btn-primary" onclick="handleSave()">確認預約</button>
                
                <div id="adminArea" class="admin-section" style="display:none;">
                    <div id="nameList" style="font-size:12px; color:#718096; margin-bottom:10px; background:#f0f4f8; padding:8px; border-radius:8px;"></div>
                    <label style="font-size:12px;">團課上限設定：</label>
                    <input type="number" id="inputLimit" placeholder="設定上限" style="padding:8px; margin-bottom:10px;">
                    <button class="btn btn-outline" style="font-size:13px;" onclick="handleBlock()">暫停/開放時段</button>
                </div>

                <button id="delBtn" class="btn btn-danger" style="display:none;" onclick="handleDelete()">清空此時段</button>
                <button class="btn btn-outline" style="border:none;" onclick="closeModal()">取消返回</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b",
        storageBucket: "gym-booking-7029b.firebasestorage.app",
        messagingSenderId: "843407214922",
        appId: "1:843407214922:web:0e7fa36481113fedb3d9b3"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let viewType = 'group'; // 預設優先看團課
    let db = {};
    let selectedId = null;
    let adminPwd = '0000';

    const hours = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

    database.ref('bookings').on('value', (snapshot) => {
        db = snapshot.val() || {};
        renderTable();
    });

    database.ref('adminConfig/password').on('value', (snapshot) => { if(snapshot.exists()) adminPwd = snapshot.val(); });

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function switchType(type) {
        viewType = type;
        document.getElementById('btnPrivate').classList.toggle('active', type === 'private');
        document.getElementById('btnGroup').classList.toggle('active', type === 'group');
        renderTable();
    }

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        header.innerHTML = '<th class="time-col">時段</th>';
        body.innerHTML = '';

        let weekDates = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentMonday);
            d.setDate(d.getDate() + i);
            let dateStr = d.toISOString().split('T')[0];
            weekDates.push(dateStr);
            let th = document.createElement('th');
            const dayNames = ["一","二","三","四","五","六","日"];
            th.innerHTML = `<span class="date-main">${dateStr.slice(8)}</span><span class="date-sub">週${dayNames[i]}</span>`;
            header.appendChild(th);
        }
        document.getElementById('weekDisplay').innerText = `${weekDates[0].slice(5)} ~ ${weekDates[6].slice(5)}`;

        hours.forEach(hour => {
            let row = document.createElement('tr');
            let tCell = document.createElement('td');
            tCell.innerText = hour;
            tCell.className = 'time-col';
            row.appendChild(tCell);

            weekDates.forEach(date => {
                let id = `${date}_${hour}`;
                let cell = document.createElement('td');
                let data = db[id];

                if (data) {
                    if (data.type === 'blocked') {
                        cell.classList.add('blocked');
                        cell.innerText = "✕";
                    } else if (data.mode === 'group') {
                        let count = data.members ? Object.keys(data.members).length : 0;
                        let max = data.max || 5;
                        if (viewType === 'group') {
                            cell.classList.add('booked-group');
                            cell.innerHTML = `團課<br>${count}/${max}`;
                            if (count >= max) cell.classList.add('full');
                        } else {
                            // 私教模式下看到團課
                            cell.classList.add('occupied');
                            cell.innerText = "團課佔用";
                        }
                    } else if (data.mode === 'private') {
                        if (viewType === 'private') {
                            cell.classList.add('booked-private');
                            cell.innerText = isAdmin ? data.name : "已預約";
                        } else {
                            // 團課模式下看到私教
                            cell.classList.add('occupied');
                            cell.innerText = "私教佔用";
                        }
                    }
                }
                cell.onclick = () => openModal(id, date, hour);
                row.appendChild(cell);
            });
            body.appendChild(row);
        });
    }

    function openModal(id, date, hour) {
        selectedId = id;
        const data = db[id];
        
        // 邏輯阻斷
        if (!isAdmin) {
            if (data && data.type === 'blocked') return;
            if (data && data.mode !== viewType) return alert("此時段已被其他類型課程佔用");
            if (data && data.mode === 'group' && data.members && Object.keys(data.members).length >= (data.max || 5)) return alert("此團體課程已滿額");
        }

        document.getElementById('mTitle').innerText = viewType === 'private' ? "私人教練指導" : "團體課程 (皮拉/動物流)";
        document.getElementById('mDate').innerText = date;
        document.getElementById('mTime').innerText = hour + ":00";
        document.getElementById('custName').value = "";
        
        const isGroup = viewType === 'group';
        document.getElementById('groupInfo').style.display = isGroup ? "block" : "none";
        if (isGroup) {
            let count = (data && data.members) ? Object.keys(data.members).length : 0;
            let max = (data && data.max) ? data.max : 5;
            document.getElementById('curCount').innerText = count;
            document.getElementById('maxCount').innerText = max;
            document.getElementById('inputLimit').value = max;
        }

        document.getElementById('adminArea').style.display = isAdmin ? "block" : "none";
        document.getElementById('delBtn').style.display = (isAdmin && data) ? "block" : "none";
        
        if (isAdmin && data) {
            let names = "";
            if (data.mode === 'private') names = "預約學員：" + data.name;
            else if (data.members) names = "團課名單：" + Object.values(data.members).join(', ');
            document.getElementById('nameList').innerText = names;
        } else {
            document.getElementById('nameList').innerText = "";
        }

        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        const name = document.getElementById('custName').value.trim();
        if (!name) return alert("請輸入姓名");

        const ref = database.ref('bookings/' + selectedId);
        if (viewType === 'private') {
            ref.set({ mode: 'private', name: name });
        } else {
            ref.child('mode').set('group');
            ref.child('members').push(name);
            let limit = isAdmin ? document.getElementById('inputLimit').value : 5;
            ref.child('max').transaction(m => m || parseInt(limit));
        }
        closeModal();
    }

    function handleBlock() {
        const ref = database.ref('bookings/' + selectedId);
        if (db[selectedId] && db[selectedId].type === 'blocked') ref.remove().then(() => closeModal());
        else ref.set({ type: 'blocked' }).then(() => closeModal());
    }

    function handleDelete() {
        if (confirm("確定清空此時段？")) database.ref('bookings/' + selectedId).remove().then(() => closeModal());
    }

    function toggleAdmin() {
        if (!isAdmin) {
            let input = prompt("管理員密碼：");
            if (input === adminPwd) isAdmin = true;
        } else isAdmin = false;
        document.getElementById('adminToggle').classList.toggle('admin-mode-active', isAdmin);
        renderTable();
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }
    function changeWeek(days) { currentMonday.setDate(currentMonday.getDate() + days); renderTable(); }

    renderTable();
</script>
</body>
</html>
