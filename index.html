<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body>
    <script>
        // 【重要】請將下方資訊替換成你從 Firebase 取得的金鑰
        const firebaseConfig = {
           var admin = require("firebase-admin");

var serviceAccount = require("path/to/serviceAccountKey.json");

admin.initializeApp({
  credential: admin.credential.cert(serviceAccount),
  databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com"
});

        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let isAdmin = false;
        let currentMonday = getMonday(new Date());
        let selectedId = null;
        let adminPwd = localStorage.getItem('gym_admin_pwd') || '0000';
        let db = {}; // 改由雲端讀取

        // 從雲端即時同步資料
        database.ref('bookings').on('value', (snapshot) => {
            db = snapshot.val() || {};
            renderTable(); // 只要有人更新，所有人的畫面都會自動重新整理
        });

        // 存檔函式改為寫入雲端
        function saveAndRefresh() {
            database.ref('bookings').set(db).then(() => {
                closeModal();
                // renderTable 會被上面的 .on('value') 自動觸發
            });
        }

        // 修改密碼同步 (可選)
        database.ref('adminConfig/password').on('value', (snapshot) => {
            if(snapshot.exists()) adminPwd = snapshot.val();
        });

        function changeAdminPassword() {
            let old = prompt("請輸入舊密碼：");
            if (old === adminPwd) {
                let newP = prompt("請輸入新密碼：");
                if (newP) {
                    database.ref('adminConfig/password').set(newP).then(() => {
                        alert("雲端密碼修改成功！");
                    });
                }
            } else {
                alert("舊密碼錯誤！");
            }
        }

        // ... (其餘 getMonday, renderTable, openModal 等邏輯維持不變) ...
    </script>
</body>
</html>
