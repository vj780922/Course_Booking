<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鈺見酪梨・健身預約 🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --light-green: #f0fff4;
            --dark-gray: #2d3748;
            --base-font-size: 16px;
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: #f7fafc; 
            display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: var(--dark-gray); 
            -webkit-tap-highlight-color: transparent;
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; box-sizing: border-box; }
        h1 { text-align: center; color: var(--primary-green); margin: 15px 0; font-size: 22px; }

        .admin-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
        .admin-btn { background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
        .admin-mode-active { background: #f56565 !important; color: white; }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--light-green); padding: 10px; border-radius: 12px; }
        .nav-btn { background: var(--primary-green); color: white; border: none; border-radius: 8px; padding: 8px 15px; cursor: pointer; font-weight: bold; }

        /* 表格響應式優化 */
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 600px; } /* 確保在小手機也能滑動看完整週 */
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 10px 5px; height: 60px; font-size: 14px; }
        
        .date-main { font-weight: bold; color: var(--dark-gray); font-size: 15px; }
        .date-sub { font-size: 11px; color: #a0aec0; display: block; }

        td { cursor: pointer; background: white; transition: background 0.2s; word-break: break-all; }
        .time-col { background-color: #f8fafc; font-weight: bold; width: 70px; color: #718096; position: sticky; left: 0; z-index: 2; border-right: 2px solid #edf2f7; }
        
        .booked { background-color: #e6fffa !important; color: #2c7a7b; font-weight: bold; font-size: 12px; }
        .blocked { background-color: #cbd5e0 !important; color: white !important; }

        /* 手機版彈窗優化 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { 
            background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; 
            max-width: 100%; animation: slideUp 0.3s ease-out; box-sizing: border-box;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-banner { width: 100%; height: 120px; background: var(--primary-green) url('https://images.unsplash.com/photo-1518611012118-296072bb5604?auto=format&fit=crop&q=80&w=600') center/cover; }
        .modal-body { padding: 20px 25px 40px 25px; }
        .course-title { font-size: 20px; font-weight: bold; margin: 5px 0; }
        
        .info-grid { background: #f7fafc; padding: 12px; border-radius: 12px; margin: 15px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-item { font-size: 13px; }
        .info-label { color: #a0aec0; display: block; margin-bottom: 2px; }
        
        input { width: 100%; padding: 15px; margin: 10px 0 20px 0; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { border: none; padding: 16px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; text-align: center; width: 100%; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }
        .btn-danger { color: #f56565; background: transparent; font-size: 14px; }

        .footer-info { margin: 20px 0; text-align: center; color: #a0aec0; font-size: 12px; }

        /* 電腦版微調：彈窗不要撐滿全螢幕 */
        @media (min-width: 600px) {
            .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; }
            @keyframes slideUp { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>鈺見酪梨・健身預約 🥑</h1>
    <div class="admin-bar">
        <button id="changePwdBtn" class="admin-btn" style="display:none;" onclick="changeAdminPassword()">修改密碼</button>
        <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">管理員</button>
    </div>
    
    <div class="controls">
        <button class="nav-btn" onclick="changeWeek(-7)">◀</button>
        <span id="weekDisplay" style="font-size: 14px; font-weight: bold;">讀取中...</span>
        <button class="nav-btn" onclick="changeWeek(7)">▶</button>
    </div>

    <div class="table-wrapper">
        <table id="bookingTable">
            <thead><tr id="dateHeader"><th class="time-col">時段</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="footer-info">
    <div>SJ | v1.5.0 Mobile Optimized</div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="modal-banner"></div>
        <div class="modal-body">
            <h2 class="course-title">個人化體能指導</h2>
            <div style="font-size: 14px; color: var(--primary-green);">教練：鈺珊 ILi 🥑</div>

            <div class="info-grid">
                <div class="info-item"><span class="info-label">日期</span><span id="displayDate" style="font-weight:bold;"></span></div>
                <div class="info-item"><span class="info-label">時段</span><span id="displayTime" style="font-weight:bold;"></span></div>
            </div>

            <div id="userFields">
                <input type="text" id="custName" placeholder="請輸入學員姓名">
            </div>

            <div class="btn-group">
                <button id="saveBtn" class="btn btn-primary" onclick="handleSave()">確認預約</button>
                <button id="blockBtn" class="btn btn-outline" style="display:none;" onclick="handleBlock()">暫停/開啟此時段</button>
                <button id="delBtn" class="btn btn-danger" style="display:none;" onclick="handleDelete()">刪除預約</button>
                <button class="btn btn-outline" style="border:none;" onclick="closeModal()">關閉</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b",
        storageBucket: "gym-booking-7029b.firebasestorage.app",
        messagingSenderId: "843407214922",
        appId: "1:843407214922:web:0e7fa36481113fedb3d9b3"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let db = {};
    let adminPwd = '0000';

    const hours = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

    database.ref('bookings').on('value', (snapshot) => {
        db = snapshot.val() || {};
        renderTable();
    });

    database.ref('adminConfig/password').on('value', (snapshot) => {
        if(snapshot.exists()) adminPwd = snapshot.val();
    });

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        header.innerHTML = '<th class="time-col">時段</th>';
        body.innerHTML = '';

        let weekDates = [];
        for (let i = 0; i < 7; i++) {
            let d = new Date(currentMonday);
            d.setDate(d.getDate() + i);
            let dateStr = d.toISOString().split('T')[0];
            weekDates.push(dateStr);
            let th = document.createElement('th');
            const dayNames = ["一","二","三","四","五","六","日"];
            th.innerHTML = `<span class="date-main">${dateStr.slice(8)}</span><span class="date-sub">週${dayNames[i]}</span>`;
            header.appendChild(th);
        }
        document.getElementById('weekDisplay').innerText = `${weekDates[0].slice(5)} ~ ${weekDates[6].slice(5)}`;

        hours.forEach(hour => {
            let row = document.createElement('tr');
            let timeCell = document.createElement('td');
            timeCell.innerText = hour;
            timeCell.className = 'time-col';
            row.appendChild(timeCell);

            weekDates.forEach(date => {
                let cell = document.createElement('td');
                let id = `${date}_${hour}`;
                if (db[id]) {
                    if (db[id].type === 'blocked') {
                        cell.classList.add('blocked');
                        cell.innerText = "✕";
                    } else {
                        cell.innerText = db[id].name;
                        cell.classList.add('booked');
                    }
                }
                cell.onclick = () => openModal(id, date, hour);
                row.appendChild(cell);
            });
            body.appendChild(row);
        });
    }

    function toggleAdmin() {
        if (!isAdmin) {
            let input = prompt("請輸入管理員密碼：");
            if (input === adminPwd) {
                isAdmin = true;
                document.getElementById('adminToggle').classList.add('admin-mode-active');
                document.getElementById('changePwdBtn').style.display = "block";
            } else if (input !== null) { alert("密碼錯誤！"); }
        } else {
            isAdmin = false;
            document.getElementById('adminToggle').classList.remove('admin-mode-active');
            document.getElementById('changePwdBtn').style.display = "none";
        }
        renderTable();
    }

    function openModal(id, date, hour) {
        selectedId = id;
        const data = db[id];
        if (data && data.type === 'blocked' && !isAdmin) return;
        
        document.getElementById('displayDate').innerText = date;
        document.getElementById('displayTime').innerText = hour + ":00";
        document.getElementById('custName').value = data ? (data.name || '') : '';
        
        document.getElementById('blockBtn').style.display = isAdmin ? "block" : "none";
        document.getElementById('delBtn').style.display = (isAdmin && data && data.type !== 'blocked') ? "block" : "none";
        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        const name = document.getElementById('custName').value.trim();
        if (!name) return alert("請輸入學員姓名");
        database.ref('bookings/' + selectedId).set({ type: 'booked', name: name }).then(() => closeModal());
    }

    function handleBlock() {
        if (db[selectedId] && db[selectedId].type === 'blocked') {
            database.ref('bookings/' + selectedId).remove().then(() => closeModal());
        } else {
            database.ref('bookings/' + selectedId).set({ type: 'blocked' }).then(() => closeModal());
        }
    }

    function handleDelete() {
        if (confirm("確定刪除此預約？")) {
            database.ref('bookings/' + selectedId).remove().then(() => closeModal());
        }
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }
    function changeWeek(days) { currentMonday.setDate(currentMonday.getDate() + days); renderTable(); }
    function changeAdminPassword() {
        let old = prompt("請輸入舊密碼：");
        if (old === adminPwd) {
            let newP = prompt("請輸入新密碼：");
            if (newP) database.ref('adminConfig/password').set(newP).then(() => alert("密碼已更新！"));
        } else { alert("舊密碼錯誤！"); }
    }

    renderTable();
</script>
</body>
</html>
