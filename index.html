<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ili 能量工作紡🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --booked-green: #c6f6d5;
            --dark-gray: #2d3748;
            --danger-red: #f56565;
            --light-bg: #f7fafc;
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: var(--light-bg); padding: 10px; margin: 0; color: var(--dark-gray); 
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; margin: auto; box-sizing: border-box; }
        
        .week-nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; background: #edf2f7; padding: 12px; border-radius: 12px; }
        .nav-btn { background: white; border: 1px solid #cbd5e0; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; min-width: 100px; }
        #weekRange { width: 100%; text-align: center; order: -1; font-weight: bold; color: var(--primary-green); font-size: 15px; margin-bottom: 5px; }
        
        @media (min-width: 600px) {
            #weekRange { width: auto; order: 0; margin-bottom: 0; }
            .nav-btn { flex: none; }
        }

        .type-selector { display: flex; background: #edf2f7; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .type-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; color: #718096; transition: 0.2s; }
        .type-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .admin-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
        .admin-btn { background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .admin-mode-active { background: var(--danger-red) !important; color: white; }

        .table-wrapper { 
            width: 100%; 
            overflow: auto; 
            max-height: 70vh; 
            border-radius: 12px; 
            border: 1px solid #edf2f7; 
        }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 800px; }
        
        thead th { 
            position: sticky; top: 0; z-index: 10; 
            background-color: #f8fafc; border-bottom: 2px solid #edf2f7; padding: 10px 4px;
        }
        
        .time-col { 
            position: sticky; left: 0; z-index: 9; 
            background-color: #f8fafc !important; font-weight: bold; width: 95px; 
            border-right: 2px solid #edf2f7; box-shadow: 2px 0 5px rgba(0,0,0,0.02);
        }
        
        thead th.time-col { z-index: 11; }
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 8px 4px; height: 75px; font-size: 12px; box-sizing: border-box; }
        
        /* 狀態樣式 */
        .past-time { background-color: #f1f1f1 !important; color: #ccc !important; }
        .booked-private { background-color: var(--booked-green) !important; color: #276749; }
        .booked-group { background-color: #ebf8ff !important; color: #2b6cb0; }
        .occupied-other { background-color: #f7fafc !important; color: #a0aec0; }
        .not-available { background-color: #fafafa !important; cursor: not-allowed !important; }
        
        /* 暫停預約樣式 */
        .blocked { background-color: #cbd5e0 !important; color: white !important; font-size: 18px; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; padding: 20px 25px 40px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }

        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 10px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        .btn { border: none; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-admin { background: #4a5568; color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @media (min-width: 600px) { .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Ili 能量工作紡🥑</h1>
    
    <div class="week-nav">
        <div id="weekRange"></div>
        <button class="nav-btn" onclick="changeWeek(-7)">← 上一週</button>
        <button class="nav-btn" onclick="changeWeek(7)">下一週 →</button>
    </div>

    <div class="type-selector">
        <button id="btnGroup" class="type-btn active" onclick="switchType('group')">團體課程</button>
        <button id="btnPrivate" class="type-btn" onclick="switchType('private')">私人教練</button>
    </div>

    <div class="admin-bar">
        <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">管理員模式</button>
    </div>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h2 id="mTitle">載入中...</h2>
        <div id="mInfo" style="font-size:12px; color:#a0aec0; margin-bottom:10px;"></div>
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
        
        <div id="bookingSection">
            <div id="mDesc" style="font-size:14px; color:#4a5568; margin-bottom:15px;"></div>
            <div id="mStatusDisplay" style="margin-bottom:15px; font-weight:bold; color: var(--primary-green);"></div>
            <div id="mMembersDisplay" style="margin-bottom:15px; font-size:13px; color:#718096; background: #f7fafc; padding: 10px; border-radius: 8px; display: none;"></div>
            <div id="formFields">
                <input type="text" id="custName" placeholder="輸入預約姓名">
                <button id="saveBtn" class="btn btn-primary" onclick="handleSave()">確認預約</button>
            </div>
        </div>

        <div id="adminSection" style="display:none; border-top: 2px solid #f7fafc; margin-top:20px; padding-top:10px;">
            <p style="font-weight:bold; color:var(--danger-red);">🛠 管理員工具</p>
            <input type="text" id="editTitle" placeholder="團課課程名稱">
            <textarea id="editDesc" placeholder="課程詳情內容" rows="2"></textarea>
            <input type="number" id="editMax" placeholder="人數上限">
            <button class="btn btn-admin" onclick="handleAdminUpdate()">儲存團課設定</button>
            <button id="blockBtn" class="btn btn-outline" style="background: #edf2f7;" onclick="handleBlockToggle()">暫停/恢復預約</button>
            <button class="btn btn-outline" style="color:red;" onclick="handleDelete()">清空並還原時段</button>
        </div>
        <button class="btn btn-outline" style="border:none;" onclick="closeModal()">返回列表</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    auth.signInAnonymously();

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let viewType = 'group';
    let db = {};
    let selectedId = null;

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        let res = new Date(d.setDate(diff));
        res.setHours(0,0,0,0);
        return res;
    }

    function changeWeek(days) {
        currentMonday.setDate(currentMonday.getDate() + days);
        renderTable();
    }

    database.ref('bookings').on('value', (s) => { db = s.val() || {}; renderTable(); });

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        const weekRangeDisplay = document.getElementById('weekRange');
        const now = new Date();
        
        header.innerHTML = '<th class="time-col">時段</th>';
        body.innerHTML = '';

        let dates = [];
        for(let i=0; i<7; i++){
            let d = new Date(currentMonday); d.setDate(d.getDate()+i);
            let ds = d.toISOString().split('T')[0];
            dates.push(ds);
            let label = `${d.getMonth()+1}/${d.getDate()}`;
            header.innerHTML += `<th>${label}<br><small>週${["一","二","三","四","五","六","日"][i]}</small></th>`;
        }
        weekRangeDisplay.innerText = `${dates[0].replace(/-/g,'/')} ~ ${dates[6].replace(/-/g,'/')}`;

        const timeSlots = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

        timeSlots.forEach(h => {
            let tr = document.createElement('tr');
            let endH = (parseInt(h)+1).toString().padStart(2, '0') + ":00";
            tr.innerHTML = `<td class="time-col">${h}~${endH}</td>`;
            
            dates.forEach(d => {
                let id = `${d}_${h}`;
                let cell = document.createElement('td');
                let data = db[id];
                let isPast = new Date(`${d}T${h}`) < now;

                if(isPast) cell.classList.add('past-time');

                if(data){
                    if(data.type === 'blocked') {
                        cell.classList.add('blocked'); cell.innerText = "✕";
                    } else if(data.mode === 'group'){
                        cell.classList.add(viewType === 'group' ? 'booked-group' : 'occupied-other');
                        cell.innerHTML = `<b>${data.title}</b>`;
                        if(isAdmin) {
                            let names = data.members ? Object.values(data.members).join(",") : "無";
                            cell.innerHTML += `<span class="name-list">${names}</span>`;
                        } else {
                            let count = data.members ? Object.keys(data.members).length : 0;
                            cell.innerHTML += `<br>${count}/${data.max || 5}`;
                        }
                    } else if(data.mode === 'private'){
                        cell.classList.add(viewType === 'private' ? 'booked-private' : 'occupied-other');
                        cell.innerText = isAdmin ? data.name : "已預約";
                    }
                } else if(!isAdmin && viewType === 'group') {
                    cell.classList.add('not-available');
                }

                cell.onclick = () => { 
                    let isBlocked = data && data.type === 'blocked';
                    let canUserClick = !isBlocked && (isAdmin || (viewType === 'private' && !data) || (viewType === 'group' && data && data.mode === 'group'));
                    if(isAdmin || (canUserClick && !isPast)) openModal(id, d, h); 
                };
                tr.appendChild(cell);
            });
            body.appendChild(tr);
        });
    }

    function openModal(id, d, h) {
        selectedId = id; const data = db[id];
        const isBlocked = data && data.type === 'blocked';
        
        document.getElementById('mTitle').innerText = isBlocked ? "此時段已關閉" : ((data && data.title) || (viewType==='group'?"團體課程":"私人教練"));
        document.getElementById('mInfo').innerText = `📅 ${d} | ⏰ ${h}:00`;
        document.getElementById('custName').value = "";
        
        document.getElementById('adminSection').style.display = isAdmin ? "block" : "none";
        document.getElementById('mDesc').innerText = isBlocked ? "管理員已暫停此時段預約。" : ((data && data.desc) || "歡迎預約。");
        
        // 鎖定狀態 UI 處理
        document.getElementById('formFields').style.display = isBlocked && !isAdmin ? "none" : "block";
        document.getElementById('blockBtn').innerText = isBlocked ? "恢復預約功能" : "暫停此時段預約";

        const membersArea = document.getElementById('mMembersDisplay');
        if(data && data.members) {
            membersArea.style.display = "block";
            membersArea.innerText = "已預約：" + Object.values(data.members).join("、");
        } else if(data && data.name) {
            membersArea.style.display = "block";
            membersArea.innerText = "預約人：" + data.name;
        } else {
            membersArea.style.display = "none";
        }

        if(isAdmin) {
            document.getElementById('editTitle').value = (data && data.title) || "";
            document.getElementById('editDesc').value = (data && data.desc) || "";
            document.getElementById('editMax').value = (data && data.max) || 5;
            document.getElementById('saveBtn').innerText = "代客預約";
        }
        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        const name = document.getElementById('custName').value.trim();
        if(!name) return alert("請輸入姓名");
        const ref = database.ref('bookings/'+selectedId);
        ref.get().then((snapshot) => {
            const data = snapshot.val();
            if(data && data.type === 'blocked') return alert("此時段不開放預約");
            if(viewType === 'private') {
                ref.update({ mode: 'private', name: name });
            } else {
                if(!data) return alert("尚未排課");
                ref.child('members').push(name);
            }
            showToast("預約成功 🥑"); closeModal();
        });
    }

    function handleAdminUpdate() {
        const title = document.getElementById('editTitle').value.trim();
        if(!title) return alert("請輸入課程名稱");
        database.ref('bookings/'+selectedId).update({
            mode: 'group', title: title, type: 'open',
            desc: document.getElementById('editDesc').value,
            max: parseInt(document.getElementById('editMax').value) || 5
        }).then(() => { showToast("排程已更新"); closeModal(); });
    }

    function handleBlockToggle() {
        const isBlocked = db[selectedId] && db[selectedId].type === 'blocked';
        database.ref('bookings/'+selectedId).update({ type: isBlocked ? 'open' : 'blocked' }).then(closeModal);
    }

    function handleDelete() { if(confirm("確定清空？")) database.ref('bookings/'+selectedId).remove().then(closeModal); }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = "show"; setTimeout(() => { t.className = ""; }, 3000); }
    function switchType(t) { viewType = t; document.getElementById('btnGroup').classList.toggle('active', t==='group'); document.getElementById('btnPrivate').classList.toggle('active', t==='private'); renderTable(); }
    function toggleAdmin() { let p = prompt("密碼"); if(p === '0000') { isAdmin = !isAdmin; document.getElementById('adminToggle').classList.toggle('admin-mode-active', isAdmin); renderTable(); } }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
    renderTable();
</script>
</body>
</html>
