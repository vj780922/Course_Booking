<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ili 能量工作紡🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --booked-green: #c6f6d5;
            --dark-gray: #2d3748;
            --danger-red: #f56565;
            --light-bg: #f7fafc;
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: var(--light-bg); padding: 10px; margin: 0; color: var(--dark-gray); 
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; margin: auto; box-sizing: border-box; }
        
        .type-selector { display: flex; background: #edf2f7; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .type-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; color: #718096; transition: 0.2s; }
        .type-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        h1 { text-align: center; color: var(--primary-green); margin: 10px 0; font-size: 22px; }

        .admin-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
        .admin-btn { background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .admin-mode-active { background: var(--danger-red) !important; color: white; }

        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 700px; }
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 8px 4px; height: 65px; font-size: 13px; }
        
        .time-col { background-color: #f8fafc; font-weight: bold; width: 90px; position: sticky; left: 0; z-index: 2; border-right: 2px solid #edf2f7; font-size: 11px; }
        
        .past-time { background-color: #f1f1f1 !important; color: #ccc !important; cursor: not-allowed !important; }
        .booked-private { background-color: var(--booked-green) !important; color: #276749; font-weight: bold; }
        .booked-group { background-color: #ebf8ff !important; color: #2b6cb0; }
        .full { background-color: #fff5f5 !important; color: #c53030 !important; font-weight: bold; }
        .blocked { background-color: #cbd5e0 !important; color: white !important; cursor: not-allowed !important; }
        .occupied-other { background-color: #f7fafc !important; color: #a0aec0 !important; font-style: italic; }
        .not-available { background-color: #fafafa !important; cursor: not-allowed !important; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; animation: slideUp 0.3s ease-out; padding: 20px 25px 40px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        .btn { border: none; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-admin { background: #4a5568; color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @media (min-width: 600px) { .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Ili 能量工作紡🥑</h1>
    <div class="type-selector">
        <button id="btnGroup" class="type-btn active" onclick="switchType('group')">團體課程</button>
        <button id="btnPrivate" class="type-btn" onclick="switchType('private')">私人教練</button>
    </div>
    <div class="admin-bar">
        <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">管理員模式</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h2 id="mTitle" style="margin:0 0 5px;">載入中...</h2>
        <div id="mInfo" style="font-size:12px; color:#a0aec0; margin-bottom:10px;"></div>
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
        
        <div id="bookingSection">
            <div id="mDesc" style="font-size:14px; color:#4a5568; margin-bottom:15px;"></div>
            <div id="mStatusDisplay" style="margin-bottom:15px; font-weight:bold;"></div>
            <input type="text" id="custName" placeholder="輸入預約姓名">
            <button id="saveBtn" class="btn btn-primary" onclick="handleSave()">確認預約</button>
        </div>

        <div id="adminSection" style="display:none; border-top: 2px solid #f7fafc; margin-top:20px; padding-top:10px;">
            <p style="font-weight:bold; color:var(--danger-red);">🛠 管理員設定 (僅您可見)</p>
            <input type="text" id="editTitle" placeholder="團課課程名稱">
            <textarea id="editDesc" placeholder="團課介紹內容" rows="2"></textarea>
            <input type="number" id="editMax" placeholder="人數上限">
            <button class="btn btn-admin" onclick="handleAdminUpdate()">儲存團課排程</button>
            <button id="blockBtn" class="btn btn-outline" onclick="handleBlockToggle()">暫停預約</button>
            <button class="btn btn-outline" style="color:red;" onclick="handleDelete()">清空該時段</button>
        </div>
        <button class="btn btn-outline" style="border:none;" onclick="closeModal()">返回列表</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    auth.signInAnonymously();

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let viewType = 'group';
    let db = {};
    let selectedId = null;

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    database.ref('bookings').on('value', (s) => { db = s.val() || {}; renderTable(); });

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        const now = new Date();
        header.innerHTML = '<th class="time-col">時段</th>';
        body.innerHTML = '';

        let dates = [];
        for(let i=0; i<7; i++){
            let d = new Date(currentMonday); d.setDate(d.getDate()+i);
            let ds = d.toISOString().split('T')[0];
            dates.push(ds);
            // 修改日期格式為 M/D
            let dateLabel = `${d.getMonth()+1}/${d.getDate()}`;
            header.innerHTML += `<th>${dateLabel}<br><small>週${["一","二","三","四","五","六","日"][i]}</small></th>`;
        }

        const timeSlots = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

        timeSlots.forEach(h => {
            let tr = document.createElement('tr');
            let endH = (parseInt(h)+1).toString().padStart(2, '0') + ":00";
            tr.innerHTML = `<td class="time-col">${h}~${endH}</td>`;
            
            dates.forEach(d => {
                let id = `${d}_${h}`;
                let cell = document.createElement('td');
                let data = db[id];
                let isPast = new Date(`${d}T${h}`) < now;

                if(isPast) cell.classList.add('past-time');

                if(data){
                    if(data.type === 'blocked') {
                        cell.classList.add('blocked'); cell.innerText = "✕";
                    } else if(data.mode === 'group'){
                        let count = data.members ? Object.keys(data.members).length : 0;
                        cell.classList.add(viewType === 'group' ? 'booked-group' : 'occupied-other');
                        cell.innerHTML = `<b>${data.title}</b><br>${count}/${data.max || 5}`;
                        if(count >= (data.max || 5)) cell.classList.add('full');
                    } else if(data.mode === 'private'){
                        cell.classList.add(viewType === 'private' ? 'booked-private' : 'occupied-other');
                        cell.innerText = (viewType === 'private' && isAdmin) ? data.name : "已預約";
                    }
                } else if(!isAdmin && viewType === 'group') {
                    cell.classList.add('not-available');
                }

                cell.onclick = () => { 
                    // 點擊判定：管理員隨時可點，學員僅限可預約時段
                    let canUserClick = (viewType === 'private' && !data) || (viewType === 'group' && data && data.mode === 'group');
                    if(isAdmin || (canUserClick && !isPast)) openModal(id, d, h); 
                };
                tr.appendChild(cell);
            });
            body.appendChild(tr);
        });
    }

    function openModal(id, d, h) {
        selectedId = id; const data = db[id];
        document.getElementById('mTitle').innerText = (data && data.title) || (viewType==='group'?"團體課":"私人教練");
        document.getElementById('mInfo').innerText = `📅 日期：${d} | ⏰ 時間：${h}:00`;
        document.getElementById('custName').value = "";
        
        // UI 分流
        document.getElementById('adminSection').style.display = isAdmin ? "block" : "none";
        document.getElementById('mDesc').innerText = (data && data.desc) || "歡迎預約課程，請輸入姓名後確認。";
        
        if(isAdmin) {
            document.getElementById('editTitle').value = (data && data.title) || "";
            document.getElementById('editDesc').value = (data && data.desc) || "";
            document.getElementById('editMax').value = (data && data.max) || 5;
            document.getElementById('blockBtn').innerText = (data && data.type === 'blocked') ? "恢復預約" : "暫停預約";
            document.getElementById('saveBtn').innerText = "代客預約";
        } else {
            document.getElementById('saveBtn').innerText = "確認預約";
        }

        // 狀態顯示
        if(data && data.mode === 'group'){
            let count = data.members ? Object.keys(data.members).length : 0;
            document.getElementById('mStatusDisplay').innerText = `目前人數：${count} / ${data.max || 5}`;
        } else {
            document.getElementById('mStatusDisplay').innerText = data ? "此時段已被佔用" : "目前無人預約";
        }

        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        const name = document.getElementById('custName').value.trim();
        if(!name) return alert("請輸入學員姓名");
        
        const ref = database.ref('bookings/'+selectedId);
        ref.get().then((snapshot) => {
            const data = snapshot.val();
            if(!isAdmin) {
                if(viewType === 'private' && data) return alert("已被預約");
                if(viewType === 'group' && (!data || data.mode !== 'group')) return alert("無開放團課");
            }
            
            // 執行預約 (代客或學員)
            if(viewType === 'private') {
                ref.update({ mode: 'private', name: name });
            } else {
                if(!data) return alert("請先設定團課名稱");
                ref.child('members').push(name);
            }
            showToast(isAdmin ? "已幫學員完成預約 🥑" : "預約成功！🥑");
            closeModal();
        });
    }

    function handleAdminUpdate() {
        const title = document.getElementById('editTitle').value.trim();
        if(!title) return alert("請輸入課程名稱");
        database.ref('bookings/'+selectedId).update({
            mode: 'group', type: 'open', title: title,
            desc: document.getElementById('editDesc').value,
            max: parseInt(document.getElementById('editMax').value) || 5
        }).then(() => { showToast("已建立排程"); closeModal(); });
    }

    function handleBlockToggle() {
        const isBlocked = db[selectedId] && db[selectedId].type === 'blocked';
        database.ref('bookings/'+selectedId).update({ type: isBlocked ? 'open' : 'blocked' }).then(closeModal);
    }

    function handleDelete() { if(confirm("確定要清空此時段？")) database.ref('bookings/'+selectedId).remove().then(closeModal); }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = "show"; setTimeout(() => { t.className = ""; }, 3000); }
    function switchType(t) { viewType = t; document.getElementById('btnGroup').classList.toggle('active', t==='group'); document.getElementById('btnPrivate').classList.toggle('active', t==='private'); renderTable(); }
    function toggleAdmin() { let p = prompt("請輸入管理員密碼"); if(p === '0000') { isAdmin = !isAdmin; document.getElementById('adminToggle').classList.toggle('admin-mode-active', isAdmin); renderTable(); } }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
    renderTable();
</script>
</body>
</html>
