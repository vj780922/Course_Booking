<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鈺見酪梨・健身預約 🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --light-green: #f0fff4;
            --booked-green: #c6f6d5;
            --dark-gray: #2d3748;
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: #f7fafc; padding: 10px; margin: 0; color: var(--dark-gray); 
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; box-sizing: border-box; }
        
        /* 頂部切換 */
        .type-selector { display: flex; background: #edf2f7; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .type-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; color: #718096; transition: 0.2s; }
        .type-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        h1 { text-align: center; color: var(--primary-green); margin: 10px 0; font-size: 22px; }

        .admin-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
        .admin-btn { background: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .admin-mode-active { background: #f56565 !important; color: white; }

        /* 課表主體 */
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 600px; }
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 8px 4px; height: 60px; font-size: 13px; }
        .time-col { background-color: #f8fafc; font-weight: bold; width: 65px; position: sticky; left: 0; z-index: 2; border-right: 2px solid #edf2f7; }
        
        /* 狀態 */
        .past-time { background-color: #f1f1f1 !important; color: #ccc !important; cursor: not-allowed !important; }
        .booked-private { background-color: var(--booked-green) !important; color: #276749; font-weight: bold; }
        .booked-group { background-color: #ebf8ff !important; color: #2b6cb0; }
        .occupied { background-color: #fbfbfb !important; color: #d0d0d0 !important; cursor: not-allowed; }
        .full { background-color: #fff5f5 !important; color: #c53030 !important; font-weight: bold; }

        /* 彈窗與提示 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; animation: slideUp 0.3s ease-out; padding: 20px 25px 40px; box-sizing: border-box; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        .btn { border: none; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }

        @media (min-width: 600px) { .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>鈺見酪梨・健身預約 🥑</h1>
    <div class="type-selector">
        <button id="btnGroup" class="type-btn active" onclick="switchType('group')">團體課程</button>
        <button id="btnPrivate" class="type-btn" onclick="switchType('private')">私人教練</button>
    </div>
    <div class="admin-bar">
        <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">管理員</button>
    </div>
    <div class="table-wrapper">
        <table id="bookingTable">
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h2 id="mTitle" style="margin:0 0 10px;">載入中...</h2>
        <div id="mDesc" style="font-size:14px; color:#666; margin-bottom:10px;"></div>
        <div id="mInfo" style="background:#f9f9f9; padding:10px; border-radius:10px; font-size:13px; margin-bottom:15px;"></div>
        
        <div id="userBooking">
            <input type="text" id="custName" placeholder="請輸入學員姓名">
            <button class="btn btn-primary" onclick="handleSave()">確認預約</button>
        </div>

        <div id="adminPanel" style="display:none; border-top:2px dashed #eee; margin-top:15px; padding-top:15px;">
            <input type="text" id="editTitle" placeholder="課程名稱">
            <textarea id="editDesc" placeholder="課程介紹" rows="2"></textarea>
            <input type="number" id="editMax" placeholder="人數上限">
            <button class="btn btn-primary" style="background:#4a5568;" onclick="handleAdminUpdate()">儲存設定</button>
            <button class="btn btn-outline" style="color:red;" onclick="handleDelete()">清空名單</button>
        </div>
        <button class="btn btn-outline" onclick="closeModal()">關閉</button>
    </div>
</div>

<div id="toast">操作成功！</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    // 1. 安全管理：匿名登入以啟用資料庫存取權限
    auth.signInAnonymously().catch(e => console.error("Auth error", e));

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let viewType = 'group';
    let db = {};
    let selectedId = null;

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    database.ref('bookings').on('value', (s) => { db = s.val() || {}; renderTable(); });

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        const now = new Date();
        header.innerHTML = '<th class="time-col">時段</th>';
        body.innerHTML = '';

        let dates = [];
        for(let i=0; i<7; i++){
            let d = new Date(currentMonday); d.setDate(d.getDate()+i);
            let ds = d.toISOString().split('T')[0];
            dates.push(ds);
            header.innerHTML += `<th>${ds.slice(8)}<br><small>週${["一","二","三","四","五","六","日"][i]}</small></th>`;
        }

        ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"].forEach(h => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td class="time-col">${h}</td>`;
            dates.forEach(d => {
                let id = `${d}_${h}`;
                let cell = document.createElement('td');
                let data = db[id];
                
                // 3. 自動清理/過期檢查
                let slotTime = new Date(`${d}T${h}`);
                let isPast = slotTime < now;
                if(isPast) cell.classList.add('past-time');

                if(data){
                    if(data.mode === 'group'){
                        let count = data.members ? Object.keys(data.members).length : 0;
                        cell.classList.add(viewType === 'group' ? 'booked-group' : 'occupied');
                        cell.innerHTML = viewType === 'group' ? `${data.title || '團課'}<br>${count}/${data.max || 5}` : '團課佔用';
                    } else if(data.mode === 'private'){
                        cell.classList.add(viewType === 'private' ? 'booked-private' : 'occupied');
                        cell.innerText = viewType === 'private' ? (isAdmin ? data.name : "已預約") : '私教佔用';
                    }
                }
                
                cell.onclick = () => { if(!isPast || isAdmin) openModal(id, d, h); };
                tr.appendChild(cell);
            });
            body.appendChild(tr);
        });
    }

    function openModal(id, d, h) {
        selectedId = id; const data = db[id];
        document.getElementById('mTitle').innerText = (data && data.title) || "預約課程";
        document.getElementById('mDesc').innerText = (data && data.desc) || "請確認日期時段並填寫姓名。";
        document.getElementById('mInfo').innerText = `時間：${d} ${h}:00`;
        document.getElementById('custName').value = "";
        
        document.getElementById('adminPanel').style.display = isAdmin ? "block" : "none";
        document.getElementById('userBooking').style.display = isAdmin ? "none" : "block";

        if(isAdmin && data) {
            document.getElementById('editTitle').value = data.title || "";
            document.getElementById('editDesc').value = data.desc || "";
            document.getElementById('editMax').value = data.max || 5;
        }
        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        // 2. 學員體驗：預約前確認
        const name = document.getElementById('custName').value.trim();
        if(!name) return alert("請輸入學員姓名");
        if(!confirm(`確認預約 ${selectedId.replace('_',' ')} 嗎？`)) return;

        const ref = database.ref('bookings/'+selectedId);
        if(viewType === 'private') ref.update({ mode: 'private', name: name });
        else { ref.child('mode').set('group'); ref.child('members').push(name); }
        showToast("預約成功！🥑");
        closeModal();
    }

    function handleAdminUpdate() {
        const ref = database.ref('bookings/'+selectedId);
        ref.update({
            mode: 'group',
            title: document.getElementById('editTitle').value,
            desc: document.getElementById('editDesc').value,
            max: parseInt(document.getElementById('editMax').value) || 5
        }).then(() => { showToast("設定已更新"); closeModal(); });
    }

    function handleDelete() { if(confirm("確定清空？")) database.ref('bookings/'+selectedId).remove().then(closeModal); }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    function switchType(t) { viewType = t; document.getElementById('btnGroup').classList.toggle('active', t==='group'); document.getElementById('btnPrivate').classList.toggle('active', t==='private'); renderTable(); }
    function toggleAdmin() { let p = prompt("密碼"); if(p === '0000') { isAdmin = !isAdmin; renderTable(); } }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
    renderTable();
</script>
</body>
</html>
