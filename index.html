<html lang="zh-TW">

    <meta charset="UTF-8">

            display: flex;

            align-items: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        .container { 
            background: white; 
            padding: 30px;

        button {

            border-radius: 8px;
            padding: 10px 20px;

            font-weight: bold;
            transition: 0.3s;

        .admin-mode-active { background: #e53e3e !important; }

            align-items: center; 
            margin-bottom: 20px; 
            background: #edf2f7; 
            padding: 15px; 
            border-radius: 12px;
        }
