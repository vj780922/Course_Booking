<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鈺見酪梨・健身預約 🥑</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --primary-green: #38a169;
            --light-green: #f0fff4;
            --booked-green: #c6f6d5;
            --dark-gray: #2d3748;
            --line-green: #06C755; /* LINE 品牌色 */
        }
        
        body { 
            font-family: "Calibri", "Microsoft JhengHei", sans-serif; 
            background-color: #f7fafc; padding: 10px; margin: 0; color: var(--dark-gray); 
        }

        .container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 1100px; margin: auto; box-sizing: border-box; }
        
        /* 視覺切換器 */
        .type-selector { display: flex; background: #edf2f7; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .type-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; color: #718096; }
        .type-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 課表色彩邏輯 */
        .color-pilates { background-color: #faf5ff !important; color: #6b46c1 !important; border-left: 4px solid #9f7aea; } /* 紫色 */
        .color-animal { background-color: #fffaf0 !important; color: #dd6b20 !important; border-left: 4px solid #ed8936; } /* 橘色 */
        .color-default { background-color: #ebf8ff !important; color: #2b6cb0 !important; border-left: 4px solid #4299e1; } /* 藍色 */
        
        /* 聯絡教練懸浮按鈕 */
        .fab-contact { 
            position: fixed; bottom: 25px; right: 25px; background-color: var(--line-green); 
            color: white; padding: 12px 20px; border-radius: 50px; font-weight: bold; 
            box-shadow: 0 4px 12px rgba(6,199,85,0.4); text-decoration: none; display: flex; align-items: center; gap: 8px; z-index: 999;
            transition: transform 0.2s;
        }
        .fab-contact:active { transform: scale(0.95); }

        /* 課表細節 */
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid #edf2f7; text-align: center; padding: 8px 4px; height: 60px; font-size: 13px; }
        .time-col { background-color: #f8fafc; font-weight: bold; width: 65px; position: sticky; left: 0; z-index: 2; border-right: 2px solid #edf2f7; }
        
        .past-time { background-color: #f1f1f1 !important; color: #ccc !important; cursor: not-allowed !important; }
        .booked-private { background-color: var(--booked-green) !important; color: #276749; font-weight: bold; border-left: 4px solid var(--primary-green); }
        .occupied { background-color: #fbfbfb !important; color: #d0d0d0 !important; cursor: not-allowed; }

        /* 彈窗優化 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; position: absolute; bottom: 0; width: 100%; border-radius: 25px 25px 0 0; padding: 20px 25px 40px; box-sizing: border-box; }
        
        .btn { border: none; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-top: 10px; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-line { background: var(--line-green); color: white; }
        .btn-outline { background: #f7fafc; color: #718096; }

        input, textarea { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; box-sizing: border-box; }

        #toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 100px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @media (min-width: 600px) { .modal-content { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 5px;">鈺見酪梨・健身預約 🥑</h1>
    <p style="text-align: center; font-size: 12px; color: #a0aec0; margin-bottom: 15px;">健康，是為了遇見更好的自己</p>

    <div class="type-selector">
        <button id="btnGroup" class="type-btn active" onclick="switchType('group')">團體課程</button>
        <button id="btnPrivate" class="type-btn" onclick="switchType('private')">私人教練</button>
    </div>

    <div class="admin-bar">
        <button id="adminToggle" class="admin-btn" style="background:none; border:none; color:#cbd5e0; cursor:pointer;" onclick="toggleAdmin()">⚙️</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr id="dateHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<a href="https://line.me/ti/p/你的LINE_ID" target="_blank" class="fab-contact">
    <span>💬 聯絡教練</span>
</a>

<div id="modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h2 id="mTitle" style="margin:0 0 5px; color:var(--dark-gray);">載入中...</h2>
        <div id="mDesc" style="font-size:14px; color:#718096; margin-bottom:15px; line-height:1.5;"></div>
        
        <div id="userBooking">
            <input type="text" id="custName" placeholder="學員全名">
            <button class="btn btn-primary" onclick="handleSave()">✅ 立即預約課程</button>
            <a href="https://line.me/ti/p/你的LINE_ID" target="_blank" class="btn btn-line">💬 諮詢課程細節</a>
        </div>

        <div id="adminPanel" style="display:none; border-top:2px dashed #eee; margin-top:20px; padding-top:15px;">
            <p style="color:red; font-size:12px; margin-bottom:5px;">管理員設定：</p>
            <input type="text" id="editTitle" placeholder="課程名稱 (例: 皮拉提斯)">
            <textarea id="editDesc" placeholder="課程介紹與相關規定" rows="3"></textarea>
            <input type="number" id="editMax" placeholder="人數上限">
            <button class="btn btn-primary" style="background:#4a5568;" onclick="handleAdminUpdate()">💾 儲存課程內容</button>
            <button class="btn btn-outline" style="color:red; font-size:12px;" onclick="handleDelete()">🗑 清空此時段</button>
        </div>
        <button class="btn btn-outline" style="border:none; margin-top:5px; color:#cbd5e0;" onclick="closeModal()">返回列表</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBQBRoaz-nlEIqVoTVhHWkAUY8BVPNYpSg",
        authDomain: "gym-booking-7029b.firebaseapp.com",
        databaseURL: "https://gym-booking-7029b-default-rtdb.firebaseio.com",
        projectId: "gym-booking-7029b"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    auth.signInAnonymously();

    let isAdmin = false;
    let currentMonday = getMonday(new Date());
    let viewType = 'group';
    let db = {};
    let selectedId = null;

    function getMonday(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    database.ref('bookings').on('value', (s) => { db = s.val() || {}; renderTable(); });

    // 自動判斷顏色類別
    function getCourseClass(title) {
        if (!title) return 'color-default';
        if (title.includes('皮拉提斯')) return 'color-pilates';
        if (title.includes('動物流')) return 'color-animal';
        return 'color-default';
    }

    function renderTable() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        const now = new Date();
        header.innerHTML = '<th class="time-col">時間</th>';
        body.innerHTML = '';

        let dates = [];
        for(let i=0; i<7; i++){
            let d = new Date(currentMonday); d.setDate(d.getDate()+i);
            let ds = d.toISOString().split('T')[0];
            dates.push(ds);
            header.innerHTML += `<th>${ds.slice(8)}<br><small>${["一","二","三","四","五","六","日"][i]}</small></th>`;
        }

        ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"].forEach(h => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td class="time-col">${h}</td>`;
            dates.forEach(d => {
                let id = `${d}_${h}`;
                let cell = document.createElement('td');
                let data = db[id];
                let isPast = new Date(`${d}T${h}`) < now;

                if(isPast) cell.classList.add('past-time');

                if(data){
                    if(data.mode === 'group'){
                        let count = data.members ? Object.keys(data.members).length : 0;
                        if(viewType === 'group'){
                            cell.classList.add(getCourseClass(data.title));
                            cell.innerHTML = `<strong>${data.title || '團課'}</strong><br>${count}/${data.max || 5}`;
                            if(count >= (data.max || 5)) cell.classList.add('full');
                        } else { cell.classList.add('occupied'); cell.innerText = '團課佔用'; }
                    } else if(data.mode === 'private'){
                        if(viewType === 'private'){
                            cell.classList.add('booked-private');
                            cell.innerText = isAdmin ? data.name : "已預約";
                        } else { cell.classList.add('occupied'); cell.innerText = '私教佔用'; }
                    }
                }
                cell.onclick = () => { if(!isPast || isAdmin) openModal(id, d, h); };
                tr.appendChild(cell);
            });
            body.appendChild(tr);
        });
    }

    function openModal(id, d, h) {
        selectedId = id; const data = db[id];
        document.getElementById('mTitle').innerText = (data && data.title) || (viewType==='group' ? "團體課程預約" : "私人教練預約");
        document.getElementById('mDesc').innerText = (data && data.desc) || "歡迎預約！若有任何問題，歡迎點擊下方聯絡教練諮詢。";
        document.getElementById('custName').value = "";
        
        document.getElementById('adminPanel').style.display = isAdmin ? "block" : "none";
        document.getElementById('userBooking').style.display = isAdmin ? "none" : "block";

        if(isAdmin && data) {
            document.getElementById('editTitle').value = data.title || "";
            document.getElementById('editDesc').value = data.desc || "";
            document.getElementById('editMax').value = data.max || 5;
        }
        document.getElementById('modal').style.display = "block";
    }

    function handleSave() {
        const name = document.getElementById('custName').value.trim();
        if(!name) return alert("請輸入學員姓名");
        const ref = database.ref('bookings/'+selectedId);
        if(viewType === 'private') ref.update({ mode: 'private', name: name });
        else { ref.child('mode').set('group'); ref.child('members').push(name); }
        showToast("預約成功！記得準時出席喔 🥑");
        closeModal();
    }

    function handleAdminUpdate() {
        const ref = database.ref('bookings/'+selectedId);
        ref.update({
            mode: 'group',
            title: document.getElementById('editTitle').value,
            desc: document.getElementById('editDesc').value,
            max: parseInt(document.getElementById('editMax').value) || 5
        }).then(() => { showToast("課程設定已更新"); closeModal(); });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.className = "show";
        setTimeout(() => { t.className = ""; }, 3000);
    }

    function switchType(t) { viewType = t; document.getElementById('btnGroup').classList.toggle('active', t==='group'); document.getElementById('btnPrivate').classList.toggle('active', t==='private'); renderTable(); }
    function toggleAdmin() { let p = prompt("請輸入密碼"); if(p === '0000') { isAdmin = !isAdmin; showToast(isAdmin ? "管理模式已開啟" : "已關閉管理模式"); renderTable(); } }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
    function handleDelete() { if(confirm("確定清空？")) database.ref('bookings/'+selectedId).remove().then(closeModal); }
    renderTable();
</script>
</body>
</html>
